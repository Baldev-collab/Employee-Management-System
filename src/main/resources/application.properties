# ===================================================================
# Employee Management System - Application Configuration
# ===================================================================

server.port=${PORT:8088}
spring.application.name=Employee Management System

# -------------------------------------------------------------------
# MySQL Database Connection
# Uses environment variables when provided, otherwise defaults to local MySQL.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Settings
# 'update' automatically synchronizes entity definitions with table schemas
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Logging Settings
# -------------------------------------------------------------------
logging.level.com.ems.employeemanagementsystem=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
