# ===================================================================
# Demo / Offline Profile Configuration
# Uses a file-persisted H2 database with MySQL compatibility mode.
# Allows immediate local execution before MySQL Server is installed.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=demo
# ===================================================================

spring.datasource.url=jdbc:h2:file:./data/employeedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Thymeleaf & Dev Tools
spring.thymeleaf.cache=false
